vmType: vz
os: Linux
arch: aarch64
images:
  - location: "https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-arm64.qcow2"
    arch: aarch64
cpus: 2
memory: "4GiB"
disk: "50GiB"
ssh:
  localPort: 0
  loadDotSSHPubKeys: true

# Ports 50xx will be visible to the host
portForwards:
  - guestPortRange: [5000, 5099]
    hostPortRange: [5000, 5099]

# overrides Lima's default of mounting $HOME read-only
mounts: []

# default software I want
provision:
  - mode: user
    script: |
      #!/usr/bin/env bash
      set -euo pipefail

      # Install Nix (single-user)
      curl -L https://nixos.org/nix/install | sh -s -- --no-daemon

      # Source nix for the rest of this script
      . "$HOME/.nix-profile/etc/profile.d/nix.sh"

      # Install Homebrew
      sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y
      sudo DEBIAN_FRONTEND=noninteractive apt-get install -y git
      NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      # Add Homebrew to PATH for the rest of this script
      eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"

      # Install zsh and direnv via Homebrew
      brew install zsh direnv

      # Change default shell to Homebrew zsh
      BREW_ZSH="$(brew --prefix)/bin/zsh"
      if ! grep -qF "$BREW_ZSH" /etc/shells; then
        echo "$BREW_ZSH" | sudo tee -a /etc/shells
      fi
      sudo chsh -s "$BREW_ZSH" "$USER"

      # Revoke sudo access now that we're done with it
      sudo rm /etc/sudoers.d/90-cloud-init-users
